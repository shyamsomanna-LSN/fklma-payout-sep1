<title>Rider Payout Dashboard</title>
<style>
:root{--bg:#f0f4f8;--card:#fff;--border:#d0dce8;--accent:#0057B8;--accent2:#003d82;--text:#1a2a3a;--muted:#5a7080;--gold:#E8A000;--green:#0a7c45;--red:#c0392b;--shadow:0 2px 12px rgba(0,87,184,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--accent);color:white;padding:12px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.ls-logo{display:flex;align-items:center;gap:7px}
.ls-logo svg{width:30px;height:30px}
.ls-logo span{font-size:16px;font-weight:800;letter-spacing:1px}
.header-title h1{font-size:18px;font-weight:700;line-height:1.2}
.cycle-sub{font-size:11px;opacity:.8;margin-top:3px;display:flex;align-items:center;gap:6px}
.cycle-badge{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600}
.header-right{margin-left:auto;text-align:right;font-size:11px;opacity:.7;line-height:1.4}
.sp{background:var(--card);border-bottom:1px solid var(--border);padding:13px 22px;display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select{border:1.5px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text);background:var(--bg);outline:none;min-width:165px}
.fg input:focus,.fg select:focus{border-color:var(--accent);background:white}
.btn1{background:var(--accent);color:white;border:none;border-radius:6px;padding:7px 17px;font-size:13px;font-weight:700;cursor:pointer;align-self:flex-end}
.btn1:hover{background:var(--accent2)}
.btn2{background:transparent;color:var(--muted);border:1.5px solid var(--border);border-radius:6px;padding:6px 11px;font-size:13px;cursor:pointer;align-self:flex-end}
.acw{position:relative}
#acl{position:absolute;top:100%;left:0;right:0;background:white;border:1.5px solid var(--accent);border-top:none;border-radius:0 0 6px 6px;max-height:210px;overflow-y:auto;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.12);display:none}
#acl div{padding:8px 11px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0}
#acl div:hover,#acl div.active{background:#e8f0fd}
.aid{font-weight:600;color:var(--accent)}
.anm{color:var(--muted);font-size:12px}
.main{padding:18px 22px;max-width:1100px;margin:0 auto}
.rc{background:var(--card);border-radius:10px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.rh{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;padding:15px 18px;display:flex;align-items:center;gap:13px}
.rav{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.ri h2{font-size:18px;font-weight:700}
.ri .rid{font-size:12px;opacity:.8;margin-top:1px}
.rtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{background:rgba(255,255,255,.18);border-radius:20px;padding:2px 8px;font-size:11px}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1px;background:var(--border)}
.met{background:var(--card);padding:13px 16px;text-align:center}
.met .ml{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.met .mv{font-size:23px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.met .ms{font-size:11px;color:var(--muted);margin-top:2px}
.crit{background:#fff3f3;border:1.5px solid var(--red);border-radius:6px;padding:7px 13px;margin:10px 18px;font-size:12px;color:var(--red)}
.sec{padding:12px 18px}
.stt{font-size:14px;font-weight:700;margin-bottom:8px}
.sb{border:1.5px solid var(--border);border-radius:7px;margin-bottom:7px;overflow:hidden}
.shd{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;background:#f5f8fc;cursor:pointer;user-select:none}
.shd:hover{background:#e8f0fd}
.sn{font-weight:600;font-size:13px;color:var(--accent)}
.sr2{font-size:13px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.sm2{font-size:11px;color:var(--muted)}
.chev{transition:transform .2s;font-size:11px;color:var(--muted)}
.chev.open{transform:rotate(180deg)}
.sbody{display:none;background:white}
.sbody.open{display:block}
.lt{width:100%;border-collapse:collapse;font-size:13px}
.lt th{background:#f0f4f8;padding:5px 11px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border)}
.lt td{padding:6px 11px;border-bottom:1px solid #f4f4f4}
.lt tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hl td{background:#f0fff4;font-weight:700}
.ic td{background:#fffbf0;color:var(--gold)}
.pp{display:inline-block;background:#e8f0fd;color:var(--accent);border-radius:10px;padding:1px 7px;font-size:10px;margin:1px}
.lw{background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.lh{padding:11px 17px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.bge{background:var(--accent);color:white;border-radius:10px;padding:1px 9px;font-size:11px}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt th{background:#f0f4f8;padding:7px 11px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
table.rt td{padding:8px 11px;border-bottom:1px solid #f4f4f4;cursor:pointer}
table.rt tr:hover td{background:#e8f0fd}
.rtid{color:var(--accent);font-weight:600}
.emp{text-align:center;padding:55px 20px;color:var(--muted)}
.emp .ei{font-size:46px;margin-bottom:8px}
.bk{background:transparent;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:0 0 10px;display:flex;align-items:center;gap:5px;font-weight:600}
/* ADJUSTMENTS */
.aform{background:#f5f8fc;border:1.5px solid var(--border);border-radius:7px;padding:10px 13px;margin:8px 18px;display:none}
.aform.open{display:block}
.arow{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-end}
.arow input,.arow select{border:1.5px solid var(--border);border-radius:6px;padding:6px 9px;font-size:13px;flex:1;min-width:110px;outline:none;background:white}
.arow input:focus,.arow select:focus{border-color:var(--accent)}
.asave{background:var(--green);color:white;border:none;border-radius:6px;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.acancel{background:transparent;color:var(--muted);border:1.5px solid var(--border);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.adel{color:var(--muted);cursor:pointer;padding:0 4px;font-size:11px;opacity:.6}
.adel:hover{color:var(--red);opacity:1}
.netbox{background:#f0fff4;border:2px solid var(--green);border-radius:8px;padding:11px 15px;display:flex;justify-content:space-between;align-items:center;margin:10px 18px 14px}
.netlbl{font-size:13px;font-weight:700;color:var(--green)}
.netsub{font-size:11px;color:#5a8a70;margin-top:2px}
.netval{font-size:20px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
@media(max-width:600px){.sp,.main{padding:11px}.fg input,.fg select{min-width:130px}.rh{flex-direction:column;align-items:flex-start}.mg{grid-template-columns:1fr 1fr}}
</style>

const inp=document.getElementById('si'),acl=document.getElementById('acl');
let aci=-1;
inp.addEventListener('input',function(){
  const q=this.value.trim().toLowerCase();acl.innerHTML='';aci=-1;
  if(q.length<2){acl.style.display='none';return}
  const m=SUMMARY.filter(r=>r.id.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)).slice(0,12);
  if(!m.length){acl.style.display='none';return}
  m.forEach(r=>{const d=document.createElement('div');d.innerHTML=`<span class="aid">${r.id}</span> \u2014 <span class="anm">${r.name} (${r.hub||'No hub'})</span>`;d.onclick=()=>{sel(r.id);acl.style.display='none';inp.value=r.id};acl.appendChild(d)});
  acl.style.display='block';
});
inp.addEventListener('keydown',function(e){
  const items=acl.querySelectorAll('div');
  if(e.key==='ArrowDown'){aci=Math.min(aci+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('active',i===aci));e.preventDefault()}
  else if(e.key==='ArrowUp'){aci=Math.max(aci-1,0);items.forEach((el,i)=>el.classList.toggle('active',i===aci));e.preventDefault()}
  else if(e.key==='Enter'){if(aci>=0&&items[aci])items[aci].click();else{acl.style.display='none';applyFilters()}}
  else if(e.key==='Escape')acl.style.display='none';
});
document.addEventListener('click',e=>{if(!e.target.closest('.acw'))acl.style.display='none'});
function fmt(n){if(!n&&n!==0)return'\u2014';return '\u20b9'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:0})}
function fmtN(n){if(!n)return'\u2014';return Number(n).toLocaleString('en-IN',{maximumFractionDigits:0})}
function applyFilters(){
  acl.style.display='none';
  const q=inp.value.trim().toLowerCase();
  const zone=document.getElementById('fz').value,state=document.getElementById('fs').value,hub=document.getElementById('fh').value;
  if(q&&RIDERS[q.toUpperCase()]){showRider(q.toUpperCase());return}
  const ex=SUMMARY.find(r=>r.id.toLowerCase()===q);if(ex){showRider(ex.id);return}
  let res=SUMMARY.filter(r=>(!q||r.id.toLowerCase().includes(q)||r.name.toLowerCase().includes(q))&&(!zone||r.zone===zone)&&(!state||r.state===state)&&(!hub||r.hub===hub));
  if(res.length===1){showRider(res[0].id);return}
  showList(res);
}
function clearAll(){
  inp.value='';['fz','fs','fh'].forEach(id=>document.getElementById(id).value='');
  const ss=document.getElementById('fs'),hs=document.getElementById('fh');
  ss.innerHTML='<option value="">All States</option>';hs.innerHTML='<option value="">All Hubs</option>';
  RAW.states.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;ss.appendChild(o)});
  RAW.hubs.forEach(h=>{const o=document.createElement('option');o.value=h;o.textContent=h;hs.appendChild(o)});
  document.getElementById('mc').innerHTML='<div class="emp"><div class="ei">&#128269;</div><h3>Search for a rider</h3><p>Enter an FHRID or use the filters above</p></div>';
}
function showList(res){
  const mc=document.getElementById('mc');
  if(!res.length){mc.innerHTML='<div class="emp"><div class="ei">&#128533;</div><h3>No riders found</h3><p>Try different filters</p></div>';return}
  mc.innerHTML=`<div class="lw"><div class="lh"><span>Riders</span><span class="bge">${res.length}</span></div><div style="overflow-x:auto"><table class="rt"><thead><tr><th>FHRID</th><th>Name</th><th>Zone</th><th>State</th><th>Hub</th><th class="num">Deliveries</th><th class="num">Revenue</th></tr></thead><tbody>${res.map(r=>`<tr onclick="sel('${r.id}')"><td class="rtid">${r.id}</td><td>${r.name||'\u2014'}</td><td>${r.zone||'\u2014'}</td><td>${r.state||'\u2014'}</td><td>${r.hub||'\u2014'}</td><td class="num">${fmtN(r.del)}</td><td class="num" style="color:var(--green);font-weight:700">${fmt(r.rev)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

function showRider(rid){

  const ini=(r.name||rid).slice(0,2).toUpperCase();

    shtml+=`<div class="sb"><div class="shd" onclick="tog(this)"><div><span class="sn">${sn}</span>${pills?`<div style="margin-top:3px">${pills}</div>`:''} ${dTxt?`<div class="sm2">${dTxt}${aTxt}${shRate?' \u00b7 \u20b9'+shRate.toFixed(1)+'/del':''}</div>`:''}</div><div style="display:flex;align-items:center;gap:9px"><span class="sr2">${fmt(sh.rev)}</span><span class="chev">\u25bc</span></div></div><div class="sbody"><table class="lt"><thead><tr><th>Component</th><th class="num">Amount / Count</th></tr></thead><tbody>${dlvdRow}${rateRow}${liRows}${incRows}<tr class="hl"><td><strong>Revenue Amount</strong></td><td class="num"><strong>${fmt(sh.rev)}</strong></td></tr><tr><td style="color:var(--muted)">Payable (after deductions)</td><td class="num" style="color:var(--green)">${fmt(sh.payable)}</td></tr></tbody></table></div></div>`;
  });
  mc.innerHTML=`<button class="bk" onclick="clearAll()">&#8592; Back</button><div class="rc"><div class="rh"><div class="rav">${ini}</div><div class="ri"><h2>${r.name||rid}</h2><div class="rid">FHRID: ${rid}</div><div class="rtags">${r.zone?`<span class="tag">&#128205; ${r.zone}</span>`:''}${r.state?`<span class="tag">&#127963;&#65039; ${r.state}</span>`:''}${r.hub?`<span class="tag">&#127981; ${r.hub}</span>`:''}<span class="tag">&#128203; ${sns.length} sheet${sns.length>1?'s':''}</span></div></div></div><div class="mg"><div class="met"><div class="ml">Base Revenue</div><div class="mv" style="color:var(--green)">${fmt(tRev)}</div><div class="ms">From main tracker</div></div><div class="met"><div class="ml">Payable (Base)</div><div class="mv">${fmt(tPay)}</div><div class="ms">After deductions</div></div><div class="met"><div class="ml">Deliveries</div><div class="mv">${fmtN(tDel)||'\u2014'}</div><div class="ms">${tAsgn>0?fmtN(tAsgn)+' assigned':'across all sheets'}</div></div><div class="met"><div class="ml">Rate/Delivery</div><div class="mv">${rate?'\u20b9'+rate.toFixed(1):'\u2014'}</div><div class="ms">Avg per delivery</div></div><div class="met" id="nm-${rid}"><div class="ml">Net Payout</div><div class="mv">\u22ef</div><div class="ms">Loading\u2026</div></div></div>${crit?`<div class="crit">${crit}`:''}<div class="sec"><div class="stt">&#128202; Earnings Breakdown by Sheet</div>${shtml}</div><div id="as-${rid}" style="border-top:1px solid var(--border);padding:0 18px"><div style="color:var(--muted);font-size:13px;padding:12px 0">Loading adjustments\u2026</div></div></div>`;
  loadAdj(rid,tRev,tPay);
}
async function loadAdj(rid,tRev,tPay){
  let entries=[];
  if(dbRef){try{const d=await dbRef.doc('adj/'+rid).get();if(d)entries=d.entries||[]}catch{}}
  adjSnap[rid]=entries;renderAdj(rid,tRev,tPay,entries);
}
async function saveAdj(rid,entries){if(!dbRef)return false;try{await dbRef.doc('adj/'+rid).set({entries});return true}catch{return false}}
function renderAdj(rid,tRev,tPay,entries){
  const sec=document.getElementById('as-'+rid);if(!sec)return;
  const adjTotal=entries.reduce((s,e)=>s+e.amt,0);
  const net=tRev+adjTotal;
  const nm=document.getElementById('nm-'+rid);
  if(nm){nm.querySelector('.mv').textContent='\u20b9'+net.toLocaleString('en-IN',{maximumFractionDigits:0});nm.querySelector('.mv').style.color='var(--green)';nm.querySelector('.ms').textContent=adjTotal>0?'+\u20b9'+adjTotal.toLocaleString('en-IN',{maximumFractionDigits:0})+' adjustments':'Base only'}
  const da=!!dbRef;
  const CYCLE_NAME="Sep 1st Cycle";
  const adjRows=entries.map((e,i)=>`<tr style="background:#f0fff4"><td>${e.type==='bounce'?'\u21a9':'+'} ${e.reason}</td><td style="color:var(--muted);font-size:11px;white-space:nowrap">${e.date||''} \u00b7 ${e.by||''}</td><td class="num" style="color:var(--green)">${fmt(e.amt)}</td><td style="text-align:center"><span class="adel" onclick="delAdj('${rid}',${i},event)">\u2715</span></td></tr>`).join('');
  const totalRow=entries.length?`<tr class="hl"><td colspan="2"><strong>Net Payout \u2014 ${CYCLE_NAME}</strong></td><td class="num" style="color:var(--green)"><strong>${fmt(net)}</strong></td><td></td></tr>`:'';
  const addBtn=da?`<button style="background:var(--accent);color:white;border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer" onclick="showAF('${rid}')">+ Add Payout</button>`:'';
  sec.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px"><span style="font-size:13px;font-weight:700;color:var(--muted)">Additional Payouts (Suppl / Bounce)</span>${addBtn}</div><div class="aform" id="af-${rid}"><div class="arow"><select id="at-${rid}" style="max-width:140px"><option value="suppl">Supplementary</option><option value="bounce">Bounce</option></select><input type="number" id="aa-${rid}" placeholder="Amount \u20b9" step="0.01" min="0" style="max-width:120px"><input type="text" id="ar-${rid}" placeholder="Reason"><input type="text" id="ad-${rid}" placeholder="Date (e.g. 01-Sep-2026)" style="max-width:145px"><button class="asave" onclick="addAdj('${rid}',${tRev},${tPay})">Save</button><button class="acancel" onclick="showAF('${rid}')">Cancel</button></div></div>${entries.length||adjRows?`<table class="lt" style="margin-top:4px"><tbody>${adjRows}${totalRow}</tbody></table>`:''}<div class="netbox"><div><div class="netlbl">Net Payout \u2014 ${CYCLE_NAME}</div><div class="netsub">Base ${fmt(tRev)}${adjTotal>0?' + Adjustments '+fmt(adjTotal):''}</div></div><div class="netval">${fmt(net)}</div></div>`;
}
function showAF(rid){const f=document.getElementById('af-'+rid);if(f)f.classList.toggle('open')}
async function addAdj(rid,tRev,tPay){
  const type=document.getElementById('at-'+rid).value;
  const amt=parseFloat(document.getElementById('aa-'+rid).value);
  const reason=document.getElementById('ar-'+rid).value.trim();
  const date=document.getElementById('ad-'+rid).value.trim();
  if(!amt||!reason){alert('Please enter an amount and a reason');return}
  let byName='Team';try{if(userRef){const me=await userRef.me();byName=me.name||byName}}catch{}
  const entries=[...(adjSnap[rid]||[]),{type,amt,reason,date:date||new Date().toLocaleDateString('en-IN'),by:byName}];
  const ok=await saveAdj(rid,entries);
  if(ok){adjSnap[rid]=entries;renderAdj(rid,tRev,tPay,entries)}else alert('Could not save \u2014 please try again');
}
async function delAdj(rid,idx,ev){
  ev.stopPropagation();if(!confirm('Remove this entry?'))return;
  const entries=[...(adjSnap[rid]||[])];entries.splice(idx,1);
  const tRev=Object.values(RIDERS[rid].sheets).reduce((s,sh)=>s+sh.rev,0);
  const tPay=Object.values(RIDERS[rid].sheets).reduce((s,sh)=>s+sh.payable,0);
  const ok=await saveAdj(rid,entries);
  if(ok){adjSnap[rid]=entries;renderAdj(rid,tRev,tPay,entries)}else alert('Delete failed');
}
function tog(hdr){const b=hdr.nextElementSibling,c=hdr.querySelector('.chev');b.classList.toggle('open');c.classList.toggle('open')}
</script>
